project_name: memscope

version: 2

before:
  hooks:
    # Run tests before building
    - go test -v ./...
    - go test -v -short ./test/integration
    # Ensure dependencies are up to date
    - go mod tidy
    # Generate documentation if needed
    - go generate ./...

builds:
  - main: ./cmd/memscope
    id: memscope
    binary: memscope
    
    env:
      - CGO_ENABLED=0
    
    goos:
      - linux
      - windows
      - darwin
    
    goarch:
      - amd64
      - arm64
    
    # Ignore arm64 on Windows (not commonly needed)
    ignore:
      - goos: windows
        goarch: arm64
    
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    
    flags:
      - -trimpath

archives:
  - id: memscope-archive
    format: tar.gz
    
    # Override format for Windows
    format_overrides:
      - goos: windows
        format: zip
    
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    
    files:
      - README.md
      - LICENSE
      - docs/**/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - typo
      - Merge pull request
      - Merge branch
      - go mod tidy
  
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .ProjectName }}"
  
  name_template: "{{.ProjectName}} v{{.Version}}"
  
  header: |
    ## memscope {{.Version}} - Memory Analysis CLI Tool
    
    🔍 **Professional memory diagnostics and optimization for Windows systems**
    
    ### What's New
    
  footer: |
    
    ---
    
    ### 📦 Installation
    
    **Windows:**
    ```powershell
    # Download memscope_Windows_x86_64.zip
    # Extract and add to PATH
    ```
    
    **macOS:**
    ```bash
    # Intel Macs
    curl -LO https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/v{{.Version}}/memscope_Darwin_x86_64.tar.gz
    tar -xzf memscope_Darwin_x86_64.tar.gz
    
    # Apple Silicon Macs  
    curl -LO https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/v{{.Version}}/memscope_Darwin_arm64.tar.gz
    tar -xzf memscope_Darwin_arm64.tar.gz
    ```
    
    **Linux:**
    ```bash
    curl -LO https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/v{{.Version}}/memscope_Linux_x86_64.tar.gz
    tar -xzf memscope_Linux_x86_64.tar.gz
    ```
    
    ### 🚀 Quick Start
    
    ```bash
    # System analysis and diagnostics
    memscope doctor
    
    # Memory configuration inspection
    memscope inspect
    
    # BIOS optimization recommendations  
    memscope recommend
    
    # Export data for analysis
    memscope export --format json --output system.json
    ```
    
    ### 📋 Security & Compliance
    
    This release includes:
    - **SBOM files** (CycloneDX & SPDX formats)
    - **Security scan results** (Trivy analysis)
    - **Checksums** for integrity verification
    - **GPG signatures** for authenticity
    
    ### 🆘 Support
    
    - 📖 **Documentation**: Check the `/docs` folder
    - 🐛 **Issues**: [Report bugs](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/issues)
    - 💬 **Help**: Run `memscope --help` for usage information
    
  draft: false
  prerelease: auto
  mode: replace

  extra_files:
    - glob: ./sbom/*
    - glob: ./release-info.json

# Sign binaries and checksums (if signing key is available)
signs:
  - cmd: gpg
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    output: true

